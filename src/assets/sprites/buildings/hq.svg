<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    HQ: a compact command building with one large roof, a clear entrance, service annex and mast.
    Plan view, four tiles square. Original artwork for Redline Tactics.
  -->
  <!-- A quiet pad makes the building sit on the ground without becoming a UI frame. -->
  <rect x="8" y="14" width="78" height="70" rx="8" fill="{{shell}}" opacity="0.32"/>
  <rect x="10" y="12" width="74" height="68" rx="7" fill="{{metalDark}}"
        stroke="{{outline}}" stroke-width="1.35" stroke-linejoin="round"/>
  <rect x="14" y="16" width="66" height="60" rx="5" fill="{{metal}}" opacity="0.65"/>

  <!-- Main operations hall: a deliberately simple large roof that reads at normal zoom. -->
  <rect x="18" y="18" width="46" height="42" rx="5" fill="{{shell}}"
        stroke="{{outline}}" stroke-width="1.55" stroke-linejoin="round"/>
  <rect x="22" y="22" width="38" height="33" rx="3" fill="{{body}}"/>
  <path d="M23 22 L59 22 L55 29 L27 33 L22 29 Z" fill="{{light}}" opacity="0.42"/>
  <!-- Roof seams and skylights: architectural detail, kept subordinate to the main mass. -->
  <g fill="{{shell}}" opacity="0.44">
    <rect x="31" y="25" width="2.4" height="27" rx="1.2"/>
    <rect x="45" y="23" width="2.4" height="29" rx="1.2"/>
  </g>
  <g fill="{{glass}}" stroke="{{outline}}" stroke-width="1">
    <rect x="25" y="36" width="11" height="9" rx="1.5"/>
    <rect x="39" y="33" width="11" height="9" rx="1.5"/>
  </g>
  <g fill="{{accent}}" opacity="0.82">
    <rect x="27" y="38" width="7" height="2" rx="1"/>
    <rect x="41" y="35" width="7" height="2" rx="1"/>
  </g>

  <!-- A front entrance overlaps the hall: instantly legible as a doorway from above. -->
  <path d="M30 57 L53 57 L62 68 L58 77 L25 77 L21 69 Z" fill="{{shell}}"
        stroke="{{outline}}" stroke-width="1.45" stroke-linejoin="round"/>
  <path d="M32 61 L51 61 L56 67 L53 72 L29 72 L27 68 Z" fill="{{metalDark}}"/>
  <path d="M42 62 L51 68 L42 71 L33 68 Z" fill="{{accent}}"/>
  <path d="M36 76 L50 76 L55 84 L31 84 Z" fill="{{metal}}" opacity="0.72"/>

  <!-- Service annex makes the footprint feel inhabited, rather than like a symmetric icon. -->
  <path d="M64 30 L78 30 L84 38 L81 58 L68 62 L61 54 L64 45 Z" fill="{{shell}}"
        stroke="{{outline}}" stroke-width="1.4" stroke-linejoin="round"/>
  <path d="M68 34 L76 34 L80 40 L77 54 L70 57 L66 52 L68 45 Z" fill="{{body}}"/>
  <g fill="{{metalLight}}" opacity="0.82">
    <rect x="70" y="39" width="7" height="2.2" rx="1.1"/>
    <rect x="70" y="44" width="7" height="2.2" rx="1.1"/>
    <rect x="70" y="49" width="7" height="2.2" rx="1.1"/>
  </g>

  <!-- Communications gear: small enough not to compete with the HQ roof. -->
  <g stroke="{{outline}}" stroke-width="1.2" stroke-linejoin="round">
    <path d="M73 30 L73 12" stroke="{{metal}}" stroke-linecap="round"/>
    <path d="M73 13 L83 16 L73 20 Z" fill="{{banner}}"/>
    <ellipse cx="83" cy="27" rx="6.2" ry="4" transform="rotate(-28 83 27)" fill="{{metal}}"/>
  </g>
  <ellipse cx="83" cy="27" rx="3.2" ry="1.9" transform="rotate(-28 83 27)" fill="{{light}}"/>
  <circle cx="83" cy="27" r="1" fill="{{accent}}"/>
</svg>
