<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 72">
  <!--
    Barracks: a low, asymmetric billet hall opening onto a muster apron.
    Plan view, three tiles square. Original artwork for Mini Command.
  -->
  <!-- The wide apron breaks the "app icon" silhouette and grounds the building on the field. -->
  <path d="M8 47 L57 47 L68 58 L61 69 L16 69 L4 59 Z" fill="{{shell}}" opacity="0.55"/>
  <path d="M7 42 L50 42 L63 51 L58 62 L14 62 L4 54 Z" fill="{{metalDark}}"
        stroke="{{outline}}" stroke-width="1.35" stroke-linejoin="round"/>
  <path d="M12 46 L48 46 L56 52 L52 57 L17 57 L9 52 Z" fill="{{metal}}" opacity="0.72"/>
  <!-- Main hall: broad roof, a clipped rear corner and a recessed service wing. -->
  <path d="M9 13 L48 5 L65 17 L61 42 L47 48 L10 39 Z" fill="{{shell}}"
        stroke="{{outline}}" stroke-width="1.55" stroke-linejoin="round"/>
  <path d="M13 16 L47 9 L60 19 L57 38 L45 43 L14 35 Z" fill="{{body}}"/>
  <path d="M14 16 L47 9 L60 19 L57 23 L17 30 Z" fill="{{light}}" opacity="0.46"/>
  <!-- Roof bays stay directional rather than reading as UI stripes. -->
  <g fill="{{shell}}" opacity="0.55">
    <path d="M21 15 L25 14 L20 36 L16 35 Z"/>
    <path d="M32 13 L36 12 L31 39 L27 38 Z"/>
    <path d="M43 11 L47 10 L42 42 L38 41 Z"/>
  </g>
  <path d="M18 31 L39 27 L45 31 L42 39 L20 35 Z" fill="{{metalDark}}"
        stroke="{{outline}}" stroke-width="1.15" stroke-linejoin="round"/>
  <g fill="{{accent}}" opacity="0.9">
    <path d="M22 32 L27 31 L24 35 L20 34 Z"/>
    <path d="M30 30.5 L35 29.5 L32 37 L28 36 Z"/>
  </g>
  <!-- Side wing, vents and covered entrance make the role legible at small scale. -->
  <path d="M48 25 L64 21 L68 31 L59 38 L51 36 Z" fill="{{shell}}"
        stroke="{{outline}}" stroke-width="1.35" stroke-linejoin="round"/>
  <path d="M52 27 L62 24.5 L64.5 30 L58.5 34 L54 33 Z" fill="{{metal}}"/>
  <g fill="{{metalLight}}" opacity="0.8">
    <path d="M55 28 L61 26.5 L61.6 28 L55.6 29.5 Z"/>
    <path d="M56.2 31 L62.2 29.5 L62.8 31 L56.8 32.5 Z"/>
  </g>
  <path d="M24 42 L43 42 L50 49 L45 57 L26 57 L19 50 Z" fill="{{shell}}"
        stroke="{{outline}}" stroke-width="1.4" stroke-linejoin="round"/>
  <path d="M28 45 L40 45 L44.5 49.5 L41.5 53 L29.5 53 L25 49.5 Z" fill="{{metalDark}}"/>
  <path d="M34.5 46 L40.5 50 L34.5 52.8 L28.5 50 Z" fill="{{accent}}"/>
  <!-- Low signal mast and banner give each side a small, readable faction accent. -->
  <g stroke="{{outline}}" stroke-width="1.15" stroke-linejoin="round">
    <path d="M16 17 L16 5" stroke="{{metal}}" stroke-linecap="round"/>
    <path d="M16 6 L26 9.5 L16 13 Z" fill="{{banner}}"/>
  </g>
</svg>
