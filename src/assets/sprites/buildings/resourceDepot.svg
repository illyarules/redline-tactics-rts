<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 72">
  <!--
    Resource Depot: a hopper over an open delivery bay holding a small pile of Credits crystal.
    Plan view, three tiles square. Original artwork for Redline Tactics.
  -->
  <g stroke="{{outline}}" stroke-width="1.5" stroke-linejoin="round" fill="{{shell}}">
    <rect x="14" y="52" width="44" height="17" rx="3"/>
    <rect x="3" y="2.5" width="66" height="57" rx="5"/>
  </g>
  <rect x="8" y="7" width="56" height="48" rx="3" fill="{{body}}"/>
  <rect x="8" y="7" width="56" height="6" rx="3" fill="{{light}}" opacity="0.3"/>
  <path d="M23 11 L49 11 L44 29 L28 29 Z" fill="{{metal}}"
        stroke="{{outline}}" stroke-width="1.5" stroke-linejoin="round"/>
  <rect x="29.5" y="25" width="13" height="4.5" rx="1.5" fill="{{metalDark}}"/>
  <rect x="14" y="33" width="44" height="18" rx="2.5" fill="{{light}}"
        stroke="{{outline}}" stroke-width="1.5" stroke-linejoin="round"/>
  <rect x="17.5" y="36" width="37" height="12" rx="2" fill="{{glass}}"/>
  <g fill="{{crystal}}" stroke="{{outline}}" stroke-width="1" stroke-linejoin="round">
    <path d="M25 37.5 L28 42 L25 46.5 L22 42 Z"/>
    <path d="M35 35.5 L38.6 41.5 L35 47.5 L31.4 41.5 Z"/>
    <path d="M45 38 L47.6 42 L45 46 L42.4 42 Z"/>
  </g>
  <rect x="18" y="55" width="22" height="5" rx="2.5" fill="{{accent}}"/>
  <g fill="{{metal}}" stroke="{{outline}}" stroke-width="1.3" stroke-linejoin="round">
    <rect x="5.5" y="14" width="10" height="13" rx="3"/>
    <rect x="56.5" y="36" width="10" height="13" rx="3"/>
  </g>
  <g stroke="{{outline}}" stroke-width="1.3" stroke-linejoin="round">
    <rect x="59" y="9" width="2.4" height="15" rx="1.2" fill="{{metal}}"/>
    <path d="M61.4 9 L51.5 12.6 L61.4 16.2 Z" fill="{{banner}}"/>
  </g>
</svg>
