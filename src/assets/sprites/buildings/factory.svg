<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    Factory: a ribbed assembly hall between two stacks, with a hazard-striped vehicle door.
    Plan view, four tiles square. Original artwork for Mini Command.
  -->
  <g stroke="{{outline}}" stroke-width="1.6" stroke-linejoin="round" fill="{{shell}}">
    <rect x="4" y="1.5" width="26" height="22" rx="3"/>
    <rect x="66" y="1.5" width="26" height="22" rx="3"/>
    <rect x="6" y="8" width="84" height="82" rx="6"/>
  </g>
  <rect x="12" y="14" width="72" height="70" rx="4" fill="{{body}}"/>
  <rect x="12" y="14" width="72" height="6" rx="3" fill="{{light}}" opacity="0.3"/>
  <g fill="{{shell}}" opacity="0.5">
    <rect x="18" y="22" width="9" height="36" rx="2"/>
    <rect x="32" y="22" width="9" height="36" rx="2"/>
    <rect x="46" y="22" width="9" height="36" rx="2"/>
    <rect x="60" y="22" width="9" height="36" rx="2"/>
  </g>
  <rect x="14" y="60" width="68" height="4" rx="2" fill="{{metalLight}}" opacity="0.75"/>
  <g stroke="{{outline}}" stroke-width="1.6" stroke-linejoin="round">
    <circle cx="17" cy="13" r="9.5" fill="{{metal}}"/>
    <circle cx="79" cy="13" r="9.5" fill="{{metal}}"/>
  </g>
  <circle cx="17" cy="13" r="4.8" fill="{{metalDark}}"/>
  <circle cx="79" cy="13" r="4.8" fill="{{metalDark}}"/>
  <rect x="24" y="67" width="48" height="17" rx="2.5" fill="{{metalDark}}"
        stroke="{{outline}}" stroke-width="1.6" stroke-linejoin="round"/>
  <g fill="{{accent}}">
    <rect x="28" y="70" width="6" height="11"/>
    <rect x="39" y="70" width="6" height="11"/>
    <rect x="50" y="70" width="6" height="11"/>
    <rect x="61" y="70" width="6" height="11"/>
  </g>
  <g fill="{{metal}}" stroke="{{outline}}" stroke-width="1.4" stroke-linejoin="round">
    <rect x="15" y="68" width="7" height="15" rx="2"/>
    <rect x="74" y="68" width="7" height="15" rx="2"/>
  </g>
  <g stroke="{{outline}}" stroke-width="1.3" stroke-linejoin="round">
    <rect x="84" y="32" width="2.6" height="17" rx="1.3" fill="{{metal}}"/>
    <path d="M86.6 32 L76 35.8 L86.6 39.6 Z" fill="{{banner}}"/>
  </g>
</svg>
