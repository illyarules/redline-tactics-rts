<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 72">
  <!--
    Power Plant: a reactor drum between two banks of cooling pipes.
    Plan view, three tiles square. Original artwork for Mini Command.
  -->
  <g stroke="{{outline}}" stroke-width="1.5" stroke-linejoin="round" fill="{{shell}}">
    <rect x="1.5" y="16" width="13" height="40" rx="3"/>
    <rect x="57.5" y="16" width="13" height="40" rx="3"/>
    <rect x="7" y="4" width="58" height="64" rx="5"/>
  </g>
  <rect x="12" y="9" width="48" height="54" rx="3" fill="{{body}}"/>
  <rect x="12" y="9" width="48" height="6" rx="3" fill="{{light}}" opacity="0.3"/>
  <g fill="{{metalDark}}" stroke="{{outline}}" stroke-width="1.2" stroke-linejoin="round">
    <rect x="2.5" y="20" width="12" height="6" rx="2"/>
    <rect x="2.5" y="32" width="12" height="6" rx="2"/>
    <rect x="2.5" y="44" width="12" height="6" rx="2"/>
    <rect x="57.5" y="20" width="12" height="6" rx="2"/>
    <rect x="57.5" y="32" width="12" height="6" rx="2"/>
    <rect x="57.5" y="44" width="12" height="6" rx="2"/>
  </g>
  <g fill="{{metal}}">
    <rect x="14" y="21" width="6" height="4" rx="1"/><rect x="14" y="33" width="6" height="4" rx="1"/>
    <rect x="14" y="45" width="6" height="4" rx="1"/><rect x="52" y="21" width="6" height="4" rx="1"/>
    <rect x="52" y="33" width="6" height="4" rx="1"/><rect x="52" y="45" width="6" height="4" rx="1"/>
  </g>
  <circle cx="36" cy="35" r="17" fill="{{shell}}" stroke="{{outline}}" stroke-width="1.6"/>
  <circle cx="36" cy="35" r="12.5" fill="{{light}}"/>
  <circle cx="36" cy="35" r="8" fill="none" stroke="{{accent}}" stroke-width="2.6"/>
  <circle cx="36" cy="35" r="3.6" fill="{{accent}}"/>
  <rect x="26" y="57" width="20" height="6" rx="2" fill="{{metalDark}}"
        stroke="{{outline}}" stroke-width="1.3"/>
  <g stroke="{{outline}}" stroke-width="1.3" stroke-linejoin="round">
    <rect x="55" y="9" width="2.4" height="15" rx="1.2" fill="{{metal}}"/>
    <path d="M57.4 9 L47.5 12.6 L57.4 16.2 Z" fill="{{banner}}"/>
  </g>
</svg>
