<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!--
    Tank: a tracked chassis carrying a round turret, seen from directly above, facing up (-Y).
    Original artwork for Mini Command.
  -->
  <g stroke="{{outline}}" stroke-width="2.2" stroke-linejoin="round">
    <rect x="2" y="7" width="12.5" height="50" rx="4" fill="{{metalDark}}"/>
    <rect x="49.5" y="7" width="12.5" height="50" rx="4" fill="{{metalDark}}"/>
  </g>
  <g fill="{{metal}}" opacity="0.9">
    <rect x="3" y="12" width="10.5" height="3.2"/><rect x="3" y="20" width="10.5" height="3.2"/>
    <rect x="3" y="28" width="10.5" height="3.2"/><rect x="3" y="36" width="10.5" height="3.2"/>
    <rect x="3" y="44" width="10.5" height="3.2"/><rect x="3" y="51" width="10.5" height="3.2"/>
    <rect x="50.5" y="12" width="10.5" height="3.2"/><rect x="50.5" y="20" width="10.5" height="3.2"/>
    <rect x="50.5" y="28" width="10.5" height="3.2"/><rect x="50.5" y="36" width="10.5" height="3.2"/>
    <rect x="50.5" y="44" width="10.5" height="3.2"/><rect x="50.5" y="51" width="10.5" height="3.2"/>
  </g>
  <g stroke="{{outline}}" stroke-width="2" stroke-linejoin="round">
    <rect x="28" y="1.5" width="8" height="34" rx="2" fill="{{metal}}"/>
    <rect x="26.8" y="1.5" width="10.4" height="7" rx="2" fill="{{metalDark}}"/>
  </g>
  <path d="M17 18 L24 9 L40 9 L47 18 L47 56 L17 56 Z" fill="{{shell}}"
        stroke="{{outline}}" stroke-width="2.6" stroke-linejoin="round"/>
  <path d="M20.5 20 L26 13 L38 13 L43.5 20 L43.5 52 L20.5 52 Z" fill="{{body}}"/>
  <rect x="23" y="46.5" width="18" height="4.5" rx="1.5" fill="{{accent}}"/>
  <circle cx="32" cy="35" r="10.5" fill="{{body}}" stroke="{{outline}}" stroke-width="2.4"/>
  <path d="M23.5 30 A10.5 10.5 0 0 1 40.5 30 Z" fill="{{light}}"/>
  <circle cx="32" cy="38" r="3.6" fill="{{shell}}" stroke="{{outline}}" stroke-width="1.4"/>
</svg>
