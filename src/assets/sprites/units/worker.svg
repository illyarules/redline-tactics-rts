<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!--
    Worker: a small rounded utility vehicle seen from directly above, facing up (-Y).
    A lit cab at the front and an open cargo bed carrying Credits crystal behind it.
    Original artwork for Mini Command.
  -->
  <g stroke="{{outline}}" stroke-width="2.3" stroke-linejoin="round" fill="{{metalDark}}">
    <rect x="1" y="13" width="12" height="14" rx="4.5"/>
    <rect x="51" y="13" width="12" height="14" rx="4.5"/>
    <rect x="1" y="37" width="12" height="14" rx="4.5"/>
    <rect x="51" y="37" width="12" height="14" rx="4.5"/>
  </g>
  <rect x="11.5" y="5" width="41" height="54" rx="11" fill="{{body}}"
        stroke="{{outline}}" stroke-width="2.6" stroke-linejoin="round"/>
  <g stroke="{{outline}}" stroke-width="1.7" stroke-linejoin="round">
    <rect x="17" y="9" width="30" height="16" rx="6" fill="{{light}}"/>
    <rect x="15" y="31" width="34" height="24" rx="5" fill="{{shell}}"/>
  </g>
  <rect x="20.5" y="11.8" width="23" height="7" rx="3" fill="{{glass}}"/>
  <circle cx="32" cy="29" r="3" fill="{{accent}}"/>
  <g fill="{{crystal}}" stroke="{{outline}}" stroke-width="1.3" stroke-linejoin="round">
    <path d="M25 35 L29.5 43 L25 51 L20.5 43 Z"/>
    <path d="M39 37 L42.8 43.5 L39 50 L35.2 43.5 Z"/>
  </g>
  <rect x="17" y="51.5" width="30" height="3.5" rx="1.7" fill="{{metal}}"/>
</svg>
