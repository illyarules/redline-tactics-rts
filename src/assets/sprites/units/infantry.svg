<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!--
    Infantry: a compact soldier silhouette seen from directly above, facing up (-Y).
    Broad shoulders carry the shape; the helmet and its dark visor mark the head and the facing,
    and the rifle to one side is what tells it apart from a vehicle at a glance.
    Original artwork for Redline Tactics.
  -->
  <g stroke="{{outline}}" stroke-width="2.1" stroke-linejoin="round" fill="{{shell}}">
    <rect x="21" y="48" width="10" height="11" rx="4"/>
    <rect x="33" y="48" width="10" height="11" rx="4"/>
    <rect x="20" y="41" width="24" height="13" rx="5"/>
  </g>
  <rect x="10" y="25" width="44" height="26" rx="12" fill="{{body}}"
        stroke="{{outline}}" stroke-width="2.5" stroke-linejoin="round"/>
  <g stroke="{{outline}}" stroke-width="2" stroke-linejoin="round">
    <rect x="43" y="9" width="9" height="28" rx="3" fill="{{metalDark}}"/>
    <rect x="41.5" y="27" width="12" height="9" rx="3" fill="{{shell}}"/>
  </g>
  <rect x="44.8" y="9.5" width="5.4" height="6" rx="2" fill="{{metalLight}}"/>
  <circle cx="31" cy="30.5" r="8.5" fill="{{light}}" stroke="{{outline}}" stroke-width="2.2"/>
  <rect x="25" y="25" width="12" height="5" rx="2.5" fill="{{glass}}"/>
  <rect x="27.5" y="35" width="7" height="3" rx="1.5" fill="{{accent}}"/>
</svg>
