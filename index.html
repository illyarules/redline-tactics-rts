<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Redline Tactics</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Cpath fill=%27%236fb0ef%27 d=%27M6 27V5h11c5 0 9 3 9 8 0 3-2 6-5 7l6 7h-7l-5-6h-3v6H6zm6-12h5c2 0 3-1 3-2s-1-2-3-2h-5v4z%27/%3E%3C/svg%3E" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #0b1020;
        color: #dce6f5;
        font-family: system-ui, sans-serif;
        overflow: hidden;
      }

      #game-root {
        width: 100vw;
        height: 100vh;
      }

      #game-root > #game-canvas {
        display: block;
        width: 100%;
        height: 100%;
        outline: none;
        touch-action: none;
      }
      .settings-control:focus-visible { outline: 2px solid #9ee6ff; outline-offset: 2px; }
      .quick-audio-toggle:hover { filter: brightness(1.18); transform: scale(1.04); }
      .quick-audio-toggle:active { filter: brightness(.92); transform: scale(.97); }
    </style>
  </head>
  <body>
    <div id="game-root"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
