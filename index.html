<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Redline Tactics</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Cpath fill=%27%236fb0ef%27 d=%27M4 26V6h6l6 10 6-10h6v20h-6V16l-6 9-6-9v10z%27/%3E%3C/svg%3E" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #0b1020;
        color: #dce6f5;
        font-family: system-ui, sans-serif;
        overflow: hidden;
      }

      #game-root {
        width: 100vw;
        height: 100vh;
      }

      #game-root > #game-canvas {
        display: block;
        width: 100%;
        height: 100%;
        outline: none;
        touch-action: none;
      }
      .tactical-hud { position: fixed; inset: auto 0 0; height: 120px; pointer-events: none; background: linear-gradient(0deg, #101d26f2, #101d26df 80%, transparent); border-bottom: 3px solid #467b97; }
      .credits { position: absolute; left: 24px; bottom: 39px; display: grid; gap: 3px; }
      .credits span, .sector, .commands small { font-size: 10px; letter-spacing: .14em; color: #9ab3c1; }
      .credits strong { color: #e7c881; font-size: 26px; font-weight: 500; }
      .credits small { font-size: 9px; color: #75929f; letter-spacing: .09em; }
      .commands { position: absolute; left: 490px; bottom: 38px; display: flex; gap: 8px; }
      .commands button { width: 60px; height: 58px; border: 1px solid #405563; border-radius: 4px; background: #192c38; color: #7796a5; font-size: 23px; opacity: .65; }
      .commands small { display: block; font-size: 8px; margin-top: 4px; }
      .minimap { position: absolute; right: 20px; bottom: 20px; width: 160px; height: 160px; border: 5px solid #162630; outline: 1px solid #5b7480; border-radius: 3px; }
      .sector { position: fixed; right: 24px; top: 24px; }
      .sector span { display: block; margin-top: 6px; font-size: 8px; text-align: right; color: #aab29c; }
      .match-timer { position: fixed; top: 22px; left: 50%; transform: translateX(-50%); color: #e9f8ff; font: 600 22px/1 system-ui,sans-serif; letter-spacing: .08em; text-shadow: 0 2px 8px #000; }
      @media (max-width: 850px) { .commands { display: none; } .minimap { width: 110px; height: 110px; } }
    </style>
  </head>
  <body>
    <div id="game-root"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
